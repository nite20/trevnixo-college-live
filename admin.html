<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TREVNIXO Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#100b1d;color:#f5efff;font:15px system-ui,Segoe UI,sans-serif}header{padding:24px;background:#1b1030;border-bottom:1px solid #59346e}h1{margin:0;font-size:26px}main{max-width:1200px;margin:auto;padding:24px 16px}.card{background:#1b1430;border:1px solid #4a3266;border-radius:14px;padding:18px;margin-bottom:18px}input,select,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #5e477d;background:#0f0b1a;color:#fff}button{background:#a21caf;border:0;cursor:pointer;font-weight:700}.secondary{background:#342148}.muted{color:#c5b6d9}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.order{padding:16px 0;border-bottom:1px solid #403052}.status{margin-left:auto}.error{color:#fca5a5}.success{color:#86efac}small{color:#d6c6e8}
</style></head><body><header><h1>TREVNIXO / Admin</h1><small>College demo only. Keep the admin token private.</small></header><main><section class="card"><h2>Admin access</h2><p>Enter ADMIN_TOKEN from your server .env file.</p><div class="row"><input id="token" type="password" placeholder="Admin token" style="flex:1;min-width:220px"><button id="load">Load orders</button><button class="secondary" id="clear">Clear token</button></div><p id="msg" class="muted">Start API server on port 4000 first.</p></section><section class="card"><div class="row"><h2>Customer orders</h2><button class="secondary" id="refresh">Refresh</button><span id="count" class="muted"></span></div><div id="orders"></div></section><section class="card"><h2>Feedback</h2><button id="feedback">Load feedback</button><pre id="feedbackOut" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></section></main><script>
const $=id=>document.getElementById(id),msg=(t,c='muted')=>{$('msg').className=c;$('msg').textContent=t};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','x-admin-token':$('token').value.trim(),...options.headers}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed '+r.status);return d}
function render(list){$('count').textContent=list.length+' orders';$('orders').innerHTML=list.length?list.map(o=>`<article class="order"><div class="row"><strong>#${esc(o.orderId)}</strong><span class="muted">${esc(new Date(o.createdAt).toLocaleString())}</span><strong>₹${Number(o.total).toLocaleString('en-IN')}</strong><select class="status" data-id="${esc(o.orderId)}">${['Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><p>${esc(o.customer?.fullName)} · ${esc(o.customer?.mobile)} · ${esc(o.customer?.email||'')}</p><p class="muted">${esc(o.customer?.address)}, ${esc(o.customer?.city)}, ${esc(o.customer?.state)} — ${esc(o.customer?.pincode)}</p><p class="muted">${(o.items||[]).map(i=>`${esc(i.product?.name||'Product')} × ${Number(i.quantity)||1}`).join(', ')}</p><small>Payment: ${esc(o.paymentStatus||o.paymentMethod||'Unknown')}</small></article>`).join(''):'<p class="muted">No backend orders yet.</p>';document.querySelectorAll('select.status').forEach(s=>s.onchange=async()=>{try{await api('/api/admin/orders/'+encodeURIComponent(s.dataset.id),{method:'PATCH',body:JSON.stringify({status:s.value})});msg('Order status updated','success')}catch(e){msg(e.message,'error')}})}
async function load(){try{const d=await api('/api/admin/orders');render(d.orders);msg('Orders loaded from backend','success')}catch(e){msg(e.message,'error')}}
$('load').onclick=load;$('refresh').onclick=load;$('clear').onclick=()=>{$('token').value='';$('orders').innerHTML='';msg('Token cleared')};$('feedback').onclick=async()=>{try{$('feedbackOut').textContent=JSON.stringify(await api('/api/admin/feedback'),null,2)}catch(e){msg(e.message,'error')}};
</script></body></html>
